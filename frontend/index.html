<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lectra</title>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.34.3/dist/cytoscape.min.js"></script>
<!-- bundles dagre and registers the "dagre" layout on window.cytoscape by itself -->
<script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@4.0.1/dist/cytoscape-dagre.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>🎓 Lectra</h1>
  <p class="sub">Your lectures, made visible.</p>

  <div class="control-row">
    <button id="genBtn" class="ring-btn" type="button" title="Generate diagram now" aria-label="Generate diagram now" disabled>
      <svg class="ring-svg" viewBox="0 0 48 48" aria-hidden="true">
        <circle class="ring-track" cx="24" cy="24" r="20"></circle>
        <circle class="ring-progress" id="ringProgress" cx="24" cy="24" r="20"></circle>
      </svg>
      <span class="ring-icon">⚡</span>
    </button>

    <div class="wave-area clickable" id="waveArea">
      <canvas id="waveCanvas"></canvas>
      <button class="warn-btn" id="warnBtn" type="button" style="display:none" title="Show connection error" aria-label="Show connection error">⚠</button>
    </div>

    <span class="timer" id="timerLabel">00:00</span>

    <button id="micBtn" class="mic-btn" type="button" title="Start listening" aria-label="Start or stop listening">🎤</button>
  </div>
  <div class="error-line" id="errorLine"></div>

  <div class="card transcript-card">
    <h2>Live transcript</h2>
    <div id="transcript"></div>
    <textarea id="transcriptEdit" spellcheck="false" placeholder="Type or paste a transcript, then press ⚡ to build the map (✓ only saves)"></textarea>
    <button id="generateFromTextBtn" type="button" title="Build the map from this text" aria-label="Build the map from this text" style="display:none">⚡</button>
    <button id="editTranscriptBtn" type="button" title="Edit or paste the transcript" aria-label="Edit or paste the transcript">✎</button>
  </div>

  <div class="card">
    <div class="card-head">
      <h2>Lecture map</h2>
      <div class="diagram-tools" id="diagramTools" style="display:none">
        <button type="button" id="tidyBtn" title="Re-arrange all the boxes">↻ Tidy</button>
        <button type="button" id="sourceBtn" title="Show the speech behind the newest boxes">📄 Source</button>
      </div>
    </div>
    <div class="map-layout">
      <div id="chartWrap">
        <p class="placeholder" id="placeholder">Waiting for something diagram-worthy…</p>
        <div id="cy"></div>
        <div id="sourceView"></div>
        <div class="zoom-controls" id="zoomControls" style="display:none">
          <button type="button" id="zoomOutBtn" title="Zoom out" aria-label="Zoom out">−</button>
          <span id="zoomLabel">100%</span>
          <button type="button" id="zoomInBtn" title="Zoom in" aria-label="Zoom in">+</button>
          <button type="button" id="fitBtn" title="Show the whole map (and follow new boxes)" aria-label="Fit the whole map in view">⤢</button>
        </div>
      </div>
      <aside class="quiz" id="quizPanel">
        <div class="quiz-head"><h3>Quiz</h3><span id="quizScore"></span></div>
        <div id="quizBody"><p class="quiz-empty">Questions appear here once the map has a few arrows.</p></div>
      </aside>
    </div>
    <p id="diagramHint" style="display:none">Scroll or drag to move around · pinch or Ctrl + scroll to zoom · drag boxes or whole topics to rearrange</p>
  </div>

<script src="app.js"></script>
</body>
</html>
